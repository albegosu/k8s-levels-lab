apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-pods
  namespace: observability
spec:
  groups:
    - name: lab
      rules:
        - alert: PodPendingOver2Min
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 2 minutes"
