apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backup.ckad.lab
spec:
  group: ckad.lab
  scope: Namespaced
  names:
    plural: backups
    singular: backup
    kind: Backup
  versions:
