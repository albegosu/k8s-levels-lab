# Scrape the gateway and the model servers into the level 8 Prometheus, and load a few alerts.
# Needs ./lab.sh addon monitoring.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: model-servers, namespace: inference }
spec:
  selector: { matchLabels: { role: model-server } }   # qwen and qwen-backup
  endpoints:
    - { port: http, path: /metrics, interval: 15s }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: litellm, namespace: inference }
spec:
  selector: { matchLabels: { app: litellm } }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      # LiteLLM protects /metrics. Prometheus sends a bearer token read from a Secret.
      # Lab shortcut: the master key. On a platform, a dedicated read-only key.
      authorization:
        type: Bearer
        credentials: { name: litellm, key: LITELLM_MASTER_KEY }
---
# Lab-sized versions of inference/manifests/prometheusrule-inference.yaml.
# llama.cpp has no latency histograms, so latency comes from the gateway.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: inference-lab, namespace: inference }
spec:
  groups:
    - name: inference-lab.symptoms
      rules:
        - alert: GatewayLatencyHigh
          expr: |
            histogram_quantile(0.95, sum by (le, requested_model) (rate(litellm_request_total_latency_metric_bucket[5m]))) > 20
          for: 5m
          labels: { severity: page }
          annotations:
            summary: "{{ $labels.requested_model }}: p95 latency through the gateway above 20 s"
        - alert: GatewayServerErrors
          expr: |
            sum by (requested_model) (rate(litellm_proxy_failed_requests_metric_total{exception_status=~"5.."}[5m]))
              / sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total[5m])) > 0.05
          for: 2m
          labels: { severity: page }
          annotations:
            summary: "{{ $labels.requested_model }}: more than 5 % of requests fail with 5xx"
        - alert: BackendDown
          expr: max by (litellm_model_name, api_base) (litellm_deployment_state) == 2
          for: 1m
          labels: { severity: page }
          annotations:
            summary: "The gateway marks {{ $labels.api_base }} as down"
    - name: inference-lab.saturation
      rules:
        - alert: ModelRequestsQueued
          expr: max by (service) (llamacpp:requests_deferred) > 0
          for: 2m
          labels: { severity: ticket }
          annotations:
            summary: "{{ $labels.service }}: requests waiting for a free slot for 2 minutes"
        - alert: FallbackInUse
          expr: sum by (requested_model) (increase(litellm_deployment_successful_fallbacks_total[10m])) > 0
          labels: { severity: ticket }
          annotations:
            summary: "{{ $labels.requested_model }} is being served by its fallback: the primary is failing"
        - alert: TeamBudgetSpent
          expr: litellm_remaining_team_budget_metric <= 0
          labels: { severity: ticket }
          annotations:
            summary: "Team {{ $labels.team_alias }} has spent its budget: its requests get 422"
---
# Grafana dashboard, loaded by the Grafana sidecar of kube-prometheus-stack.
