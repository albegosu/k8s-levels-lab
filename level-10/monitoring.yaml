        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "1 \u00b7 Are users OK?",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Gateway latency p50 / p95",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(litellm_request_total_latency_metric_bucket[2m])))",
              "legendFormat": "p50",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(litellm_request_total_latency_metric_bucket[2m])))",
              "legendFormat": "p95",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Failed requests by status",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (exception_status) (rate(litellm_proxy_failed_requests_metric_total[2m]))",
              "legendFormat": "{{exception_status}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
