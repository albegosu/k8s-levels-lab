apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-web
  namespace: shop
  labels:
    # ExternalDNS can filter on a label like this one to create the DNS record.
    managed-by: internal-dns
spec:
  hostnames:
    - shop.lab.local
  parentRefs:
    - name: internal
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        # TLS usually terminates at the load balancer; tell the app it was HTTPS.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: shop-web
          port: 80
