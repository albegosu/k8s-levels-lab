apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.ingress.host }}
  parentRefs:
    - name: internal
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-web
          port: 80
