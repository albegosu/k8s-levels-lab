apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-app
  namespace: shop
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: shop
    kind: SecretStore
  target:
    name: shop-app
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/shop, property: DATABASE_URL }
    - secretKey: APP_KEY
      remoteRef: { key: dev/shop, property: APP_KEY }
    - secretKey: RABBITMQ_PASSWORD
      remoteRef: { key: dev/shop, property: RABBITMQ_PASSWORD }
