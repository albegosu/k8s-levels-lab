# In the cloud the provider would be AWS Secrets Manager (or Vault, 1Password...)
# with IRSA credentials. Here we use the External Secrets "fake" provider: same flow, no cloud.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shop
  namespace: shop
spec:
  provider:
    fake:
      data:
        - key: dev/shop
          value: '{"DATABASE_URL":"mysql://shop:lab@db:3306/shop","APP_KEY":"lab-not-a-secret","RABBITMQ_PASSWORD":"lab"}'
