# Five typical faults in the "faults" namespace. Do not read this file before diagnosing.
apiVersion: v1
kind: Namespace
metadata:
  name: faults
---
# A
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: faults }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo 'FATAL: DATABASE_URL is not set'; exit 1"]
---
# B
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: faults }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: python:3.13-alpine
          command: ["python", "-c", "x = bytearray(200 * 1024 * 1024); import time; time.sleep(3600)"]
          resources:
            limits: { memory: 64Mi }
---
# C
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: faults }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{ name: http, containerPort: 9898 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: faults }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: http }]
---
# D
apiVersion: apps/v1
kind: Deployment
metadata: { name: reports, namespace: faults }
spec:
  replicas: 1
  selector: { matchLabels: { app: reports } }
  template:
    metadata: { labels: { app: reports } }
    spec:
      nodeSelector: { karpenter.sh/nodepool: gpu }
      containers:
        - name: reports
          image: registry.k8s.io/pause:3.10
---
# E
apiVersion: apps/v1
kind: Deployment
metadata: { name: queue, namespace: faults }
spec:
  replicas: 1
  selector: { matchLabels: { app: queue } }
  template:
    metadata: { labels: { app: queue } }
    spec:
      containers:
        - name: queue
          image: busybox:1.36
          command: ["sleep", "infinity"]
          envFrom:
            - secretRef: { name: queue-credentials }
